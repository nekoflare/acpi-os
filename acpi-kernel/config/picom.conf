backend = "xrender";
active-opacity = 0.85;
inactive-opacity = 0.70;
frame-opacity = 0.85;
shadow = false;
fading = false;
# Lite XL stays opaque, and so do games: Minecraft (GLFW names its window
# class after the first window title, "Minecraft 1.20.1") and any fullscreen
# window. Firefox too (Alpine's build sets class "firefox-esr").
opacity-rule = [
  "100:class_g = 'com.lite_xl.LiteXL' || class_i = 'lite-xl' || class_g *?= 'lite' || name *= 'Lite XL'",
  "100:class_g *?= 'minecraft' || name *?= 'minecraft' || fullscreen",
  "100:class_g *?= 'firefox'"
];
