local dejavu = 'DejaVu Sans:file=/fonts/DejaVuSans.ttf:pixelsize='

conky.config = {
    alignment = 'top_right',
    gap_x = 36,
    gap_y = 46,
    own_window = true,
    own_window_type = 'override',
    own_window_color = '#211b18',
    border_inner_margin = 18,
    minimum_width = 258,
    maximum_width = 258,
    use_xft = true,
    font = dejavu .. '16',
    default_color = '#f7ead8',
    color1 = '#e6ad72',
    color2 = '#82634e',
    draw_shades = false,
    draw_graph_borders = false,
    update_interval = 1,
    cpu_avg_samples = 2,
    short_units = true,
    double_buffer = true,
};

-- Label on the left, value right-aligned, thin bar underneath.
local function meter(label, value, bar)
    return '${font ' .. dejavu .. '14}${color2}' .. label .. '${color}' ..
        '${alignr}' .. value .. '${font}\n' ..
        '${color1}' .. bar .. '${color}'
end

conky.text = table.concat({
    '${font ' .. dejavu .. '60}${time %H:%M}${font}' ..
        '${color1}${font ' .. dejavu .. '24} ${time %S}${font}${color}',
    '${color2}${hr 1}${color}',
    '${font ' .. dejavu .. '18}${time %A, %d %B}${font}',
    '${voffset 4}${color2}${hr 1}${color}',
    meter('CPU', '${cpu cpu0}%', '${cpubar cpu0 6}'),
    meter('MEM', '${mem} / ${memmax}', '${membar 6}'),
    meter('DISK', '${fs_used /} / ${fs_size /}', '${fs_bar 6 /}'),
}, '\n');
