<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- firefox-probe's FONTCONFIG_FILE: Alpine's defaults (aliases, hinting,
     conf.d) plus the desktop's DejaVu fonts in /fonts. Alpine's own file only
     searches /usr/share/fonts, which the image does not have, so Firefox drew
     every glyph as a hex box. -->
<fontconfig>
  <include ignore_missing="yes">/opt/alpine/etc/fonts/fonts.conf</include>
  <dir>/fonts</dir>
  <dir>/opt/alpine/usr/lib/firefox-esr/fonts</dir>
</fontconfig>
